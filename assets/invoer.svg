<text x="400" y="166" text-anchor="middle" font-size="31" font-weight="700" fill="#17324d">Verwerken</text>
<text x="647" y="166" text-anchor="middle" font-size="31" font-weight="700" fill="#17324d">Uitvoer</text>
<rect x="67" y="223" width="172" height="80" rx="10" fill="#eef5fb" stroke="#17324d" stroke-width="5"/>
