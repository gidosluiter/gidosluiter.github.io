<text x="647" y="365" text-anchor="middle" font-size="25" fill="#5b6d80">Beeldscherm</text>
<text x="400" y="450" text-anchor="middle" font-size="28" fill="#17324d">Gegevens in → verwerking → resultaat uit</text></g>
</svg>