<rect x="349" y="211" width="103" height="103" rx="12" fill="#2563eb"/>
<path d="M365 200 V185 M389 200 V185 M413 200 V185 M437 200 V185 M365 325 V340 M389 325 V340 M413 325 V340 M437 325 V340 M339 227 H323 M339 251 H323 M339 275 H323 M339 299 H323 M462 227 H478 M462 251 H478 M462 275 H478 M462 299 H478" stroke="#17324d" stroke-width="6" stroke-linecap="round"/>
<text x="400" y="274" text-anchor="middle" font-size="31" font-weight="700" fill="#fff">CPU</text>
<path d="M514 260 H529" stroke="#2563eb" stroke-width="6" marker-end="url(#arrow)"/>
<rect x="570" y="213" width="154" height="96" rx="9" fill="#17324d"/>
