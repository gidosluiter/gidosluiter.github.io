<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" role="img" aria-labelledby="title desc">
<title id="title">Van invoer naar uitvoer</title>
<desc id="desc">Een toetsenbord levert invoer. De CPU verwerkt de gegevens. Het beeldscherm laat de uitvoer zien. Pijlen geven de volgorde aan.</desc>
<defs><marker id="arrow" markerWidth="4" markerHeight="4" refX="3" refY="2" orient="auto"><path d="M0 0 L4 2 L0 4 Z" fill="#2563eb"/></marker></defs>
<rect width="800" height="500" rx="28" fill="#eef5fb"/>
<g font-family="Arial, sans-serif">
<text x="400" y="65" text-anchor="middle" font-size="34" font-weight="700" fill="#17324d">Hoe werkt een computer?</text>
