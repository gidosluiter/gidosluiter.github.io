<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" role="img" aria-labelledby="title desc">
<title id="title">Acht bits: 00000101 is vijf</title>
<desc id="desc">De acht binaire posities hebben van links naar rechts de gewichten 128, 64, 32, 16, 8, 4, 2 en 1. In 00000101 staan alleen de posities 4 en 1 aan: samen 5.</desc>

<rect width="800" height="500" rx="28" fill="#eef5fb"/>
<g font-family="Arial, sans-serif">
<text x="400" y="70" text-anchor="middle" font-size="34" font-weight="700" fill="#17324d">8 bits = 1 byte</text>
<text x="400" y="111" text-anchor="middle" font-size="25" fill="#5b6d80">Elke positie heeft een eigen waarde</text><text x="88" y="158" text-anchor="middle" font-size="29" font-weight="700" fill="#17324d">128</text><rect x="44" y="187" width="82" height="103" rx="14" fill="#fff"/><text x="85" y="257" text-anchor="middle" font-size="58" font-weight="700" fill="#5b6d80">0</text><text x="177" y="158" text-anchor="middle" font-size="29" font-weight="700" fill="#17324d">64</text><rect x="133" y="187" width="82" height="103" rx="14" fill="#fff"/><text x="174" y="257" text-anchor="middle" font-size="58" font-weight="700" fill="#5b6d80">0</text><text x="266" y="158" text-anchor="middle" font-size="29" font-weight="700" fill="#17324d">32</text><rect x="222" y="187" width="82" height="103" rx="14" fill="#fff"/><text x="263" y="257" text-anchor="middle" font-size="58" font-weight="700" fill="#5b6d80">0</text><text x="355" y="158" text-anchor="middle" font-size="29" font-weight="700" fill="#17324d">16</text><rect x="311" y="187" width="82" height="103" rx="14" fill="#fff"/><text x="352" y="257" text-anchor="middle" font-size="58" font-weight="700" fill="#5b6d80">0</text><text x="444" y="158" text-anchor="middle" font-size="29" font-weight="700" fill="#17324d">8</text><rect x="400" y="187" width="82" height="103" rx="14" fill="#fff"/><text x="441" y="257" text-anchor="middle" font-size="58" font-weight="700" fill="#5b6d80">0</text><text x="533" y="158" text-anchor="middle" font-size="29" font-weight="700" fill="#17324d">4</text><rect x="489" y="187" width="82" height="103" rx="14" fill="#2563eb"/><text x="530" y="257" text-anchor="middle" font-size="58" font-weight="700" fill="#fff">1</text><text x="622" y="158" text-anchor="middle" font-size="29" font-weight="700" fill="#17324d">2</text><rect x="578" y="187" width="82" height="103" rx="14" fill="#fff"/><text x="619" y="257" text-anchor="middle" font-size="58" font-weight="700" fill="#5b6d80">0</text><text x="711" y="158" text-anchor="middle" font-size="29" font-weight="700" fill="#17324d">1</text><rect x="667" y="187" width="82" height="103" rx="14" fill="#2563eb"/><text x="708" y="257" text-anchor="middle" font-size="58" font-weight="700" fill="#fff">1</text>
<rect x="235" y="326" width="330" height="78" rx="18" fill="#dceafb"/>
<text x="400" y="377" text-anchor="middle" font-size="43" font-weight="700" fill="#17324d">4 + 1 = 5</text>
<text x="400" y="456" text-anchor="middle" font-size="30" fill="#17324d">00000101₂ = 5₁₀</text></g>
</svg>