<text x="400" y="305" text-anchor="middle" font-size="36" font-weight="700" fill="#17324d">Gemini</text>
<rect x="324" y="333" width="152" height="46" rx="22" fill="#eef5fb"/>
<text x="400" y="364" text-anchor="middle" font-size="23" fill="#5b6d80">Stel een vraag</text>
