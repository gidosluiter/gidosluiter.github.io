<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" role="img" aria-labelledby="title desc">
<title id="title">Gemini op een smartphone</title>
<desc id="desc">Een algemene smartphone met het label Gemini is verbonden met pictogrammen voor tekst, beeld en spraak. Het toestel stelt geen specifiek telefoonmodel voor.</desc>

<rect width="800" height="500" rx="28" fill="#eef5fb"/>
<g font-family="Arial, sans-serif">
<text x="400" y="60" text-anchor="middle" font-size="34" font-weight="700" fill="#17324d">AI op je telefoon</text>
<path d="M286 245 H204 M514 199 H584 M514 328 H584" fill="none" stroke="#5b6d80" stroke-width="5" stroke-dasharray="9 8"/>
<rect x="283" y="94" width="234" height="337" rx="31" fill="#17324d"/>
<rect x="296" y="109" width="208" height="306" rx="21" fill="#fff"/>
<rect x="369" y="120" width="62" height="7" rx="4" fill="#5b6d80"/>
